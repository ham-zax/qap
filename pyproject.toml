[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qap"
version = "0.1.0.dev0"
description = "Deterministic, spot-only crypto inventory rebalancing research."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.12,<3",
    "uvicorn>=0.52.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qap"]

[dependency-groups]
dev = [
    "bt>=1.2.3",
    "httpx2>=2.10.0",
    "hypothesis>=6.165.10",
    "import-linter",
    "pyright",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_network: opt-in smoke tests against public unauthenticated endpoints",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src/qap", "tests", "scripts"]
exclude = ["data", "runs", "web/node_modules", "web/dist"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
